name: Game release QA

on:
  push:
    paths:
      - 'adventure/dist/**'
      - 'adventure/tools/build_web.py'
      - 'adventure/tools/package_download.py'
      - 'adventure/tools/verify_web.py'
      - 'adventure/tools/assemble_story_film.py'
      - 'adventure/PLAY.txt'
      - 'adventure/tests/browser/**'
      - 'adventure/tests/material-renderer-browser.py'
      - '.github/workflows/game-release-qa.yml'
      - '.github/workflows/stage-tested-game.yml'
      - '.github/scripts/game_evidence.py'
      - '.github/scripts/game_chromium.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            adventure/dist
            adventure/tools
            adventure/tests/browser
            .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer and build dependencies
        run: |
          python -m pip install 'Pillow==11.3.0' 'playwright==1.56.0'
          bash .github/scripts/game_chromium.sh
      - name: Build and unpack the downloadable edition
        run: |
          python adventure/tools/build_web.py "$RUNNER_TEMP/edition"
          mkdir "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/evidence"
          python adventure/tools/package_download.py "$RUNNER_TEMP/edition" "$RUNNER_TEMP/until-we-return.zip"
          unzip -q "$RUNNER_TEMP/until-we-return.zip" -d "$RUNNER_TEMP/unpacked"
          python adventure/tools/verify_web.py "$RUNNER_TEMP/unpacked" > "$RUNNER_TEMP/evidence/verified-edition.json"
          (cd "$RUNNER_TEMP" && sha256sum until-we-return.zip > evidence/archive.sha256)
      - name: Play the extracted game offline
        run: |
          python adventure/tests/browser/release_qa.py "$RUNNER_TEMP/unpacked/index.html" "$RUNNER_TEMP/evidence"
      - name: Keep the tested edition
        uses: actions/upload-artifact@v4
        with:
          name: until-we-return-zip
          path: ${{ runner.temp }}/until-we-return.zip
          compression-level: 0
      - name: Keep videos, screenshots and observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-evidence
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 14

  animated-voyage:
    needs: chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            adventure/tests/browser
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: until-we-return-zip
          path: ${{ runner.temp }}/tested
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the same Chromium renderer
        run: |
          python -m pip install 'playwright==1.56.0'
          bash .github/scripts/game_chromium.sh
      - name: Walk through the extracted game with full animation
        run: |
          mkdir "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/animated-evidence"
          unzip -q "$RUNNER_TEMP/tested/until-we-return.zip" -d "$RUNNER_TEMP/unpacked"
          python adventure/tests/browser/animated_route.py "$RUNNER_TEMP/unpacked/index.html" "$RUNNER_TEMP/animated-evidence"
      - name: Keep the animated campaign record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animated-voyage
          path: ${{ runner.temp }}/animated-evidence
          if-no-files-found: warn
          retention-days: 14

  lighting-study:
    needs: chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            adventure/tests/browser
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: until-we-return-zip
          path: ${{ runner.temp }}/tested
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and image measurement tools
        run: |
          python -m pip install 'Pillow==11.3.0' 'playwright==1.56.0'
          bash .github/scripts/game_chromium.sh
      - name: Compare Original and Cinematic in the offline release
        run: |
          mkdir "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/material-evidence"
          unzip -q "$RUNNER_TEMP/tested/until-we-return.zip" -d "$RUNNER_TEMP/unpacked"
          python adventure/tests/browser/material_pass.py "$RUNNER_TEMP/unpacked/index.html" \
            "$RUNNER_TEMP/tested/until-we-return.zip" "$RUNNER_TEMP/material-evidence"
      - name: Exercise shader data channels and context lifetime
        run: |
          version_dir=$(jq -r '.directory' "$RUNNER_TEMP/unpacked/release.json")
          CASTAWAY_RENDERER_DIST="$RUNNER_TEMP/unpacked/$version_dir" \
            python adventure/tests/material-renderer-browser.py > "$RUNNER_TEMP/material-evidence/shader-pixels.json"
      - name: Keep full viewport captures, paired study and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-evidence
          path: ${{ runner.temp }}/material-evidence
          if-no-files-found: warn
          retention-days: 14

  story-film:
    needs: chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            adventure/tests/browser
            adventure/tools
            .github/scripts
      - uses: actions/download-artifact@v4
        with:
          name: until-we-return-zip
          path: ${{ runner.temp }}/tested
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media verification tools
        run: |
          python -m pip install 'Pillow==11.3.0' 'playwright==1.56.0'
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chrome; fi
          bash .github/scripts/game_chromium.sh
      - name: Watch the offline game reels and verify their controls
        run: |
          mkdir "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/film-evidence" "$RUNNER_TEMP/film-master"
          unzip -q "$RUNNER_TEMP/tested/until-we-return.zip" -d "$RUNNER_TEMP/unpacked"
          python adventure/tests/browser/story_film_pass.py "$RUNNER_TEMP/unpacked/index.html" \
            "$RUNNER_TEMP/tested/until-we-return.zip" "$RUNNER_TEMP/film-evidence" \
            --chromium "$(command -v google-chrome)" --check-webm-shell
      - name: Assemble the standalone film from the tested reels
        run: |
          python adventure/tools/assemble_story_film.py "$RUNNER_TEMP/unpacked" \
            "$RUNNER_TEMP/film-master/until-we-return-story-film.mp4" --report "$RUNNER_TEMP/film-master/master.json"
      - uses: actions/upload-artifact@v4
        with:
          name: story-film-master
          path: ${{ runner.temp }}/film-master
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-film-evidence
          path: ${{ runner.temp }}/film-evidence
          if-no-files-found: warn
          retention-days: 14

  stage-draft:
    needs: [chromium, animated-voyage, lighting-study, story-film]
    if: github.repository == 'OnFiala/auckland-castaways' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/edition-')
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/stage-tested-game.yml
