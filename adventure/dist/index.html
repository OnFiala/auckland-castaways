<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#262b29"><meta name="description" content="Malovaná point-and-click adventura. Prozkoumej vrak, spoj nalezené předměty a připrav první noc na ostrově."><title>Dokud se nevrátíme — První noc</title><link rel="stylesheet" href="style.css"><script defer src="art.js"></script><script defer src="engine.js"></script><script defer src="app.js"></script></head><body>
<main class="game-shell" id="game">
<header class="game-header"><div class="brand">DOKUD SE NEVRÁTÍME <span>PRVNÍ NOC</span></div><div class="goals" id="goals" aria-label="Přístřeší, oheň a signál"></div><nav aria-label="Nabídka hry"><button id="hint" title="Nápověda" aria-label="Obrazová nápověda">?</button><button id="reveal" title="Ukázat aktivní místa" aria-label="Ukázat aktivní místa">◉</button><button id="settings" title="Nastavení" aria-label="Nastavení">☷</button></nav></header>
<section class="scene" id="scene" tabindex="-1" aria-label="Herní scéna"><div id="backdrop" class="backdrop"></div><div class="weather" aria-hidden="true"><div class="fog"></div><div class="rain" id="rain"></div></div><div class="world-changes" id="world-changes" aria-hidden="true"></div><div class="targets" id="targets"></div><div class="exits" id="exits"></div><div class="player" id="player" aria-hidden="true"><div class="player-shadow"></div><div class="puppet"><img class="puppet-body" src="assets/sailor.png" alt=""><img class="puppet-leg leg-left" src="assets/sailor.png" alt=""><img class="puppet-leg leg-right" src="assets/sailor.png" alt=""></div><div class="thought" id="thought"></div></div><div class="arrival" id="arrival"></div><div class="scene-label" id="scene-label"></div><div class="completion" id="completion" hidden><span class="chapter-seal">I</span><h1>První noc. Společně.</h1><p>Přístřeší. Oheň. Znamení pro moře.</p><button id="keep-exploring">Zůstat u ohně</button><button id="new-game">Hrát znovu</button><small>První hratelná kapitola adventury</small></div></section>
<div class="interaction-line"><span id="action-label">Prozkoumej břeh.</span><button id="cancel-item" hidden aria-label="Odložit vybraný předmět">×</button><span id="saved" aria-label="Stav ukládání">●</span></div>
<section class="inventory-bar" aria-label="Inventář"><div class="bag-symbol" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M19 22 15 53q17 10 34 0l-4-31Zm7-2-3-13h17l-3 13M18 23q14 8 29 0M23 35q10 5 18 0"/></svg></div><div class="inventory" id="inventory"></div><button class="help" id="help" aria-label="Jak ovládat adventuru">⌘<span>Jak hrát</span></button></section>
<div class="caption" id="caption" role="status" aria-live="polite"></div><div class="first-hint" id="first-hint"><span class="gesture">☝</span><span>Prozkoumej · vezmi · použij</span><button id="dismiss-hint" aria-label="Skrýt úvodní nápovědu">×</button></div>
</main><div class="cursor-item" id="cursor-item" aria-hidden="true"></div>
<dialog id="modal" aria-labelledby="modal-title"><button id="modal-close" class="close" aria-label="Zavřít">×</button><h2 id="modal-title"></h2><div id="modal-body"></div></dialog><noscript>Adventura potřebuje JavaScript.</noscript>
</body></html>
