<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2b211c"><meta name="description" content="Malovaná point-and-click adventura. Prozkoumej vrak, spoj nalezené předměty a připrav první noc na ostrově."><title>Dokud se nevrátíme — První noc</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="interface.css"><script defer src="interface.js"></script><script defer src="art.js"></script><script defer src="engine.js"></script><script defer src="app.js"></script></head><body>
<main class="game-shell" id="game">
<header class="game-header" data-material="timber-strip"><div class="brand">DOKUD SE NEVRÁTÍME <span>PRVNÍ NOC</span></div><div class="goals" id="goals" aria-label="Přístřeší, oheň a signál"></div><nav aria-label="Nabídka hry"><button id="hint" title="Nápověda" aria-label="Obrazová nápověda"><span class="button-metal" data-ui-painting="brass-button"></span><svg class="ui-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M10 11c0-8 13-8 13 0 0 5-7 5-7 10"/><circle cx="16" cy="26" r="1"/></svg></button><button id="reveal" title="Ukázat aktivní místa" aria-label="Ukázat aktivní místa"><span class="button-metal" data-ui-painting="brass-button"></span><svg class="ui-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M3 16c7-13 19-13 26 0-7 13-19 13-26 0Z"/><circle cx="16" cy="16" r="5"/></svg></button><button id="settings" title="Nastavení" aria-label="Nastavení"><span class="button-metal" data-ui-painting="brass-button"></span><svg class="ui-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M6 9h20M6 16h20M6 23h20"/><circle cx="12" cy="9" r="3"/><circle cx="21" cy="16" r="3"/><circle cx="11" cy="23" r="3"/></svg></button></nav></header>
<section class="scene" id="scene" tabindex="-1" aria-label="Herní scéna"><div id="backdrop" class="backdrop"></div><div class="weather" aria-hidden="true"><div class="fog"></div><div class="rain" id="rain"></div></div><div class="world-changes" id="world-changes" aria-hidden="true"></div><div class="targets" id="targets"></div><div class="exits" id="exits"></div><div class="player" id="player" aria-hidden="true"><div class="player-shadow"></div><div class="puppet"><img class="puppet-body" src="assets/sailor.png" alt=""><img class="puppet-leg leg-left" src="assets/sailor.png" alt=""><img class="puppet-leg leg-right" src="assets/sailor.png" alt=""></div><div class="thought" id="thought"></div></div><div class="arrival" id="arrival"></div><div class="scene-label" id="scene-label"></div><div class="completion" id="completion" role="region" aria-labelledby="completion-title" hidden data-material="dialog-paper"><span class="chapter-seal">I</span><h1 id="completion-title">První noc. Společně.</h1><p>Přístřeší. Oheň. Znamení pro moře.</p><button id="keep-exploring">Zůstat u ohně</button><button id="new-game">Hrát znovu</button><small>První hratelná kapitola adventury</small></div></section>
<div class="interaction-line"><span id="action-label">Prozkoumej břeh.</span><button id="cancel-item" hidden aria-label="Odložit vybraný předmět">×</button><span id="saved" aria-label="Stav ukládání">●</span></div>
<section data-material="inventory-canvas" class="inventory-bar" aria-label="Inventář"><div class="bag-symbol" aria-hidden="true" data-ui-painting="satchel"></div><div class="inventory" id="inventory"></div><button class="help" id="help" aria-label="Jak ovládat adventuru"><svg class="ui-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M16 8c-4-3-8-3-12-2v20c4-2 8-1 12 2 4-3 8-4 12-2V6c-4-1-8-1-12 2Zm0 0v20M7 12l5 1M7 17l5 1M20 13l5-1M20 18l5-1"/></svg><span>Jak hrát</span></button></section>
<div class="caption" id="caption" role="status" aria-live="polite"></div><div class="first-hint" id="first-hint" data-material="paper-tab"><span class="gesture"><svg class="ui-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="m9 25-4-9q-1-4 3-2l4 4V6q0-4 4-2v12-8q4-3 4 2v7-5q4-2 4 3v5l-4 8H11"/></svg></span><span>Prozkoumej · vezmi · použij</span><button id="dismiss-hint" aria-label="Skrýt úvodní nápovědu">×</button></div>
</main><div class="cursor-item" id="cursor-item" aria-hidden="true"></div>
<dialog data-material="dialog-paper" id="modal" aria-labelledby="modal-title"><button id="modal-close" class="close" aria-label="Zavřít">×</button><h2 id="modal-title"></h2><div id="modal-body"></div></dialog><noscript>Adventura potřebuje JavaScript.</noscript>
</body></html>
